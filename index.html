<!doctype html><html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Жай есепті құрама есепке айналдыру</title><style>*{box-sizing:border-box}body{margin:0;background:#eaf5ff;font-family:'Times New Roman',serif;color:#112c6c}.head{background:linear-gradient(90deg,#ff9c24,#ffd15c);text-align:center;padding:15px;font-size:clamp(25px,3vw,43px);font-weight:bold;color:#8b2600}.wrap{max-width:1500px;margin:auto;padding:15px}.tabs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:10px}.tabs button,.next,.reset{font:bold clamp(19px,2vw,28px) 'Times New Roman';border:2px solid #2479d8;border-radius:16px;padding:12px 22px;background:#e8f4ff;color:#083a9c;cursor:pointer}.tabs button.active{background:#0758d8;color:white}.layout{display:grid;grid-template-columns:1.05fr 1fr;gap:16px;align-items:stretch}.picture,.panel{border:4px solid #54b8ed;border-radius:24px;background:white;padding:15px}.picture{display:flex;align-items:center;justify-content:center;min-height:480px;overflow:hidden}.picture img{width:100%;max-width:100%;height:auto;object-fit:contain;display:block;border-radius:12px}.panel{height:100%}.panel{border-color:#e7b44d;padding:22px;min-height:480px}.panel h2{font-size:clamp(26px,2.5vw,39px);color:#a34518;margin:0 0 15px}.problem .num{color:#e11b22;font-weight:900;text-shadow:0 1px 0 #fff}.problem .place{color:#0875c9}.problem{font-size:clamp(23px,2.35vw,36px);font-weight:bold;line-height:1.3;margin:8px 0 18px}.question{font-size:clamp(23px,2.2vw,34px);font-weight:bold;color:#123e9c;margin:14px 0 10px}.answers{display:flex;gap:14px;flex-wrap:wrap}.answers button{font:bold clamp(25px,2.6vw,39px) 'Times New Roman';min-width:88px;padding:10px 22px;border-radius:15px;border:3px solid #5a9fd7;background:#fff2b3;color:#173b8b;cursor:pointer;touch-action:manipulation}.answers button:hover{background:#d9f7b4}.feedback{font-size:clamp(22px,2vw,31px);font-weight:bold;color:#27813c;margin:9px 0}.wrong{color:#b72e2e}.solution{margin-top:8px;font-size:clamp(24px,2.2vw,35px);font-weight:bold;line-height:1.22;color:#103b95}.solution div{margin:3px 0}.next{background:#ffe37b;margin-top:14px}.reset{background:#6549d8;color:white;margin-top:14px}.hidden{display:none}.note{font-size:clamp(18px,1.7vw,25px);text-align:center;margin-top:12px}@media(max-width:850px){.layout{grid-template-columns:1fr}.panel{min-height:0}.picture{padding:8px;min-height:0}.picture img{width:100%;max-width:100%}.panel{padding:15px}.answers button{min-width:75px}}</style></head><body><header class="head">🍁 Жай есепті құрама есепке айналдыру 🍁</header><main class="wrap"><div class="tabs"><button id="simpleTab" class="active" onclick="go(0)">1. Жай есеп</button><button id="complexTab" onclick="go(1)">2. Құрама есеп</button></div><div class="layout"><section class="picture"><img src="scene.png" alt="Бурабайға 12 бала, Жасыбайға 13 бала және 2 ересек адам барады"></section><section class="panel"><h2 id="heading"></h2><div id="problem" class="problem"></div><div id="q1" class="question"></div><div id="a1" class="answers"></div><div id="f1" class="feedback" aria-live="polite"></div><div id="q2" class="question hidden"></div><div id="a2" class="answers hidden"></div><div id="f2" class="feedback" aria-live="polite"></div><div id="solution" class="solution hidden"></div><button id="next" class="next hidden" onclick="go(1)">Құрама есепке өту ➜</button><button class="reset" onclick="go(stage)">↻ Қайта бастау</button></section></div><p class="note">Жауапты басып таңдаңыз. Дұрыс жауаптан кейін келесі сұрақ ашылады.</p></main><script>let stage=0;const $=id=>document.getElementById(id);function buttons(id,vals,correct,callback){$(id).innerHTML='';vals.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>{if(v===correct){[...$(id).children].forEach(x=>x.disabled=true);b.style.background='#b5f3a4';callback()}else{b.style.background='#ffd2d2';$('f'+id.slice(-1)).textContent='Қайта ойланып көр!';$('f'+id.slice(-1)).classList.add('wrong')}};$(id).appendChild(b)})}function go(s){stage=s;$('simpleTab').classList.toggle('active',s===0);$('complexTab').classList.toggle('active',s===1);['q2','a2','solution','next'].forEach(id=>$(id).classList.add('hidden'));['f1','f2'].forEach(id=>{$(id).textContent='';$(id).classList.remove('wrong')});$('a2').innerHTML='';$('heading').textContent=s===0?'1. Жай есеп':'2. Құрама есеп';$('problem').innerHTML=s===0?'Күзгі демалыста <span class="place">Бурабайға</span> <span class="num">12 бала</span>, ал <span class="place">Жасыбайға</span> <span class="num">13 бала</span> баруды жоспарлады. Барлығы неше бала демалуды жоспарлады?':'Күзгі демалыста <span class="place">Бурабайға</span> <span class="num">12 бала</span>, ал <span class="place">Жасыбайға</span> <span class="num">13 бала</span> баруды жоспарлады. Олармен <span class="num">2 ересек адам</span> бірге барады. Барлығы неше адам демалуды жоспарлады?';$('q1').textContent=s===0?'1-сұрақ. Барлығы неше бала барады?':'1-сұрақ. Барлығы неше бала барады?';buttons('a1',s===0?[24,26,25]:[26,25,24],25,()=>{ $('f1').textContent='✓ Дұрыс!';if(s===0){$('solution').innerHTML='<div>1-амал: 12 + 13 = 25</div><div>Жауабы: 25 бала.</div>';$('solution').classList.remove('hidden');$('next').classList.remove('hidden')}else{$('q2').textContent='2-сұрақ. Ересектерді қосқанда барлығы неше адам барады?';$('q2').classList.remove('hidden');$('a2').classList.remove('hidden');buttons('a2',[27,26,28],27,()=>{$('f2').textContent='🎉 Жарайсың! Екі сұраққа да дұрыс жауап бердің!';$('solution').innerHTML='<div>1-амал: 12 + 13 = 25</div><div>2-амал: 25 + 2 = 27</div><div>Жауабы: 27 адам.</div>';$('solution').classList.remove('hidden')})}})}go(0)</script></body></html>
